<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 동네 마음지도</title>
<style>
:root{--ink:#29271f;--paper:#fbf8f1;--green:#a9d5ae;--blue:#83bfd0;--lav:#e9def0;--yellow:#fff2a9;--muted:#817d72}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
header{padding:22px 28px 16px;display:flex;align-items:end;justify-content:space-between;gap:12px;border-bottom:1px solid #e9e2d6}
h1{font-size:clamp(23px,3vw,34px);margin:0;font-weight:850;letter-spacing:-1.5px}.sub{margin:7px 0 0;color:#777064;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d8d0c3;background:white;border-radius:999px;padding:9px 14px;font-weight:700;color:var(--ink);cursor:pointer}.btn:hover{background:#f1eadf}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;padding:18px;max-width:1800px;margin:auto}
.map-wrap{position:relative;align-self:start;background:#fff;border:1px solid #eee5d8;border-radius:22px;overflow:hidden;box-shadow:0 8px 28px #55462a0c}
.map{display:block;width:100%;height:auto;user-select:none}.map-stage{position:relative;line-height:0}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:#fff;border-radius:17px 17px 17px 4px;padding:8px 12px;box-shadow:0 4px 12px #332a2040;display:flex;align-items:center;gap:7px;cursor:pointer;line-height:1.15;white-space:nowrap;font-weight:800;font-size:14px;border:2px solid #fff;touch-action:none}
.pin:before{content:"";width:10px;height:10px;border-radius:50%;background:#e47d55;box-shadow:0 0 0 3px #f9d7c7}.pin.active{outline:3px solid #e6a56f;z-index:20}.pin.pending{border-style:dashed;background:#fff8df}.pin small{font-size:10px;color:#8a6a40;font-weight:700}
.side{background:#fff;border:1px solid #eee5d8;border-radius:22px;padding:18px;min-height:460px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:12px}
.side h2{font-size:22px;margin:0 0 4px}.muted{color:var(--muted);font-size:13px}.intro{background:#f7f2e9;border-radius:14px;padding:15px;margin:14px 0}

.modal{position:fixed;inset:0;background:#17140fd9;display:none;align-items:center;justify-content:center;z-index:99;padding:22px}.modal.show{display:flex}.modal img{max-width:95vw;max-height:92vh;object-fit:contain}.close{position:absolute;right:20px;top:18px;background:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:22px;cursor:pointer}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:10px}.side{position:relative;top:auto;max-height:none;min-height:300px;order:2}header{padding:16px;align-items:start;flex-direction:column}.map-wrap{order:1}.pin{font-size:11px;padding:6px 8px}.pin:before{width:8px;height:8px}}
@media(max-width:480px){.layout{gap:10px}.pin{font-size:10px;gap:4px;padding:5px 6px}.pin small{display:none}.side{padding:14px}}

/* Archive entries: one polished card per original spreadsheet row */
.cards{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.record{display:block;background:#fffdf9;border:1px solid #eadfce;border-radius:16px;padding:15px 17px;box-shadow:0 2px 7px rgba(65,48,28,.06);overflow-wrap:anywhere;white-space:pre-wrap}
.record .num{font-size:12px;font-weight:700;letter-spacing:.04em;color:#9a7652;background:#f4eadc;border-radius:999px;display:inline-flex;padding:5px 10px;margin-bottom:9px}
.record .record-text{font-size:15px;line-height:1.75;color:#332f29}
.record .cell + .cell{margin-top:7px;padding-top:7px;border-top:1px solid #eee5d9}
.pending-box,#pending,.pending-chips,.unlocated,.unknown-pin-help{display:none!important}
</style></head><body>
<header><div><h1>우리 동네 마음지도</h1><p class="sub">주민들이 남긴 동네의 기억을 공간별로 모아둔 작은 아카이브</p></div>
</header>
